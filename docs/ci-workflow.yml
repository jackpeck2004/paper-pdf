name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the pinned PDF engine
        run: bash scripts/bootstrap.sh
      - name: Build the native app
        run: bash scripts/build-app.sh
      - name: Run regression and native document tests
        run: bash scripts/test-native.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict build/Paper.app
